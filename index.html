<script>
let allData = [];
const charts = {};

// 1. ระบุ URL สำรอง (ใช้กรณีโหลดไฟล์ local ไม่ติด)
const BACKUP_URL = 'https://raw.githubusercontent.com/akekalak12-glitch/akekalakch/main/data.csv';

async function loadData() {
    showToast("กำลังดึงข้อมูล...");
    try {
        // ลองดึงจากไฟล์ที่อยู่ข้างๆ index.html ก่อน (ดีที่สุดสำหรับ GitHub Pages / Netlify)
        let response = await fetch('data.csv');
        
        // ถ้าหาไม่เจอ (404) ให้ลองดึงจาก URL ตรงของ GitHub
        if (!response.ok) {
            console.warn("Local data.csv not found, trying backup URL...");
            response = await fetch(BACKUP_URL);
        }

        if (!response.ok) throw new Error('ไม่สามารถโหลดข้อมูลได้ทั้งจาก Local และ GitHub');
        
        const csvText = await response.text();

        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                if (results.data.length === 0) {
                    showToast("ไฟล์ว่างเปล่าหรือไม่มีข้อมูล");
                    return;
                }
                processData(results.data);
                showToast("โหลดข้อมูลสำเร็จ: " + results.data.length + " รายการ");
            },
            error: (err) => showToast("Parsing Error: " + err.message)
        });
    } catch (error) {
        showToast("เกิดข้อผิดพลาด: " + error.message);
        console.error("Fetch error:", error);
    }
}

function processData(rawData) {
    allData = rawData.map(r => {
        // ใช้ฟังก์ชันช่วยดึงค่าเพื่อป้องกันชื่อหัวตารางมีเว้นวรรค (Trim)
        const findVal = (targetName) => {
            const key = Object.keys(r).find(k => k.trim() === targetName);
            return key ? r[key] : null;
        };

        const trade = parseFloat(String(findVal("ราคาซื้อขายในช่วง 0.6 - 0.9") || 0).replace(/,/g, ''));
        const market = parseFloat(String(findVal("ราคาของหน่วย") || 0).replace(/,/g, ''));
        const assessed = parseFloat(String(findVal("ราคาประเมินใหม่ของแปลงเซลที่เลือก") || 0).replace(/,/g, ''));
        const pDiff = parseFloat(String(findVal("เปอร์เซนต์ความแตกต่างจากราคาตลาด") || 0).replace(/[%]/g, ''));

        return {
            group: findVal("รหัสกลุ่มที่ดิน") || "-",
            tradePrice: trade,
            marketPrice: market,
            newAssessed: assessed,
            pctDiff: pDiff,
            asRatio: parseFloat(findVal("AS_Ratio_New") || 0)
        };
    }).filter(d => !isNaN(d.tradePrice) && d.tradePrice > 0);

    render();
}

// ... ฟังก์ชัน render(), updateCharts(), updateTable() อื่นๆ ให้ใช้ตามเดิมได้เลยครับ ...
</script>
