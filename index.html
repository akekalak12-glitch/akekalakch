<script>
    let rawData = [];
    let charts = {};
    const CSV_URL = 'https://raw.githubusercontent.com/akekalak12-glitch/akekalakch/main/data.csv';

    async function init() {
        const status = document.getElementById('status');
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error('Network response was not ok');
            const csvData = await response.text();
            
            Papa.parse(csvData, {
                header: false, // ปิดการใช้ Header Name เพื่อใช้ Index แทน
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data.length <= 1) {
                        status.textContent = "⚠️ ไม่พบข้อมูลในไฟล์";
                        return;
                    }

                    // ข้ามแถวที่ 0 (หัวตาราง) และเริ่มเก็บข้อมูลจากแถวที่ 1
                    const dataRows = results.data.slice(1);

                    rawData = dataRows.map(row => {
                        const cleanNum = (val) => {
                            if (!val) return 0;
                            return parseFloat(String(val).replace(/,/g, '').replace(/%/g, '').trim()) || 0;
                        };
                        
                        // อ้างอิงตามลำดับคอลัมน์ใน data.csv ของคุณ
                        return {
                            group: row[2] || "-",       // คอลัมน์ C: รหัสกลุ่มที่ดิน
                            type: row[7] || "-",        // คอลัมน์ H: ประเภท
                            tradePrice: cleanNum(row[3]), // คอลัมน์ D: ราคาซื้อขาย
                            marketPrice: cleanNum(row[5]), // คอลัมน์ F: ราคาของหน่วย (ราคาตลาด)
                            newAssessed: cleanNum(row[8]), // คอลัมน์ I: ราคาประเมินใหม่
                            asRatio: cleanNum(row[9]),    // คอลัมน์ J: AS_Ratio_New
                            pctDiff: cleanNum(row[10])    // คอลัมน์ K: %แตกต่าง
                        };
                    }).filter(d => d.tradePrice > 0);

                    if (rawData.length === 0) {
                        status.textContent = "⚠️ ข้อมูลไม่ถูกต้อง";
                        return;
                    }

                    setupFilters();
                    updateDashboard(rawData);
                    status.textContent = "✅ โหลดสำเร็จ " + rawData.length + " รายการ";
                }
            });
        } catch (error) {
            console.error("Fetch Error:", error);
            status.textContent = "❌ โหลดไม่สำเร็จ: " + error.message;
        }
    }

    function setupFilters() {
        const groups = [...new Set(rawData.map(d => d.group))].sort((a,b) => a-b);
        const types = [...new Set(rawData.map(d => d.type))].sort();
        
        const gFilter = document.getElementById('groupFilter');
        const tFilter = document.getElementById('typeFilter');
        
        // ล้างค่าเดิมก่อนเพิ่มใหม่ (ป้องกันกรณี reload)
        gFilter.innerHTML = '<option value="all">ทั้งหมด</option>';
        tFilter.innerHTML = '<option value="all">ทั้งหมด</option>';

        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g; opt.textContent = `กลุ่ม ${g}`;
            gFilter.appendChild(opt);
        });

        types.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            tFilter.appendChild(opt);
        });
    }

    function applyFilters() {
        const gVal = document.getElementById('groupFilter').value;
        const tVal = document.getElementById('typeFilter').value;
        const filtered = rawData.filter(d => (gVal === 'all' || d.group == gVal) && (tVal === 'all' || d.type === tVal));
        updateDashboard(filtered);
    }

    function resetFilters() {
        document.getElementById('groupFilter').value = 'all';
        document.getElementById('typeFilter').value = 'all';
        updateDashboard(rawData);
    }

    function updateDashboard(data) {
        document.getElementById('totalCount').textContent = data.length.toLocaleString();
        
        const avg = data.length > 0 ? data.reduce((a, b) => a + b.pctDiff, 0) / data.length : 0;
        document.getElementById('avgDiff').textContent = avg.toFixed(2) + '%';

        const sortedDiff = data.map(d => d.pctDiff).sort((a,b) => a-b);
        const median = sortedDiff.length > 0 ? (sortedDiff.length % 2 !== 0 ? sortedDiff[Math.floor(sortedDiff.length / 2)] : (sortedDiff[sortedDiff.length / 2 - 1] + sortedDiff[sortedDiff.length / 2]) / 2) : 0;
        document.getElementById('medianDiff').textContent = median.toFixed(2) + '%';

        const sortedAS = data.map(d => d.asRatio).sort((a,b) => a-b);
        const medAS = sortedAS.length > 0 ? sortedAS[Math.floor(sortedAS.length / 2)] : 0;
        document.getElementById('medianAS').textContent = medAS.toFixed(4);

        updateCharts(data);
        updateTable(data);
    }

    function updateCharts(data) {
        const ctx1 = document.getElementById('priceChart').getContext('2d');
        const ctx2 = document.getElementById('diffChart').getContext('2d');
        if (charts.price) charts.price.destroy();
        if (charts.diff) charts.diff.destroy();

        charts.price = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: data.map((_, i) => i + 1),
                datasets: [
                    { label: 'ราคาซื้อขาย', data: data.map(d => d.tradePrice), borderColor: '#2563eb', tension: 0.3, pointRadius: 2 },
                    { label: 'ราคาตลาด', data: data.map(d => d.marketPrice), borderColor: '#d97706', tension: 0.3, pointRadius: 2 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        charts.diff = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: data.map((_, i) => i + 1),
                datasets: [{
                    label: '% ความแตกต่าง',
                    data: data.map(d => d.pctDiff),
                    backgroundColor: data.map(d => d.pctDiff > 30 ? '#ef4444' : '#10b981')
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function updateTable(data) {
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = data.map(d => `
            <tr class="hover:bg-gray-50 border-b border-gray-100">
                <td class="px-6 py-3">${d.group}</td>
                <td class="px-6 py-3">${d.type}</td>
                <td class="px-6 py-3 text-right">${d.tradePrice.toLocaleString()}</td>
                <td class="px-6 py-3 text-right">${d.marketPrice.toLocaleString()}</td>
                <td class="px-6 py-3 text-right font-bold ${d.pctDiff > 30 ? 'text-red-600' : 'text-green-600'}">${d.pctDiff.toFixed(2)}%</td>
            </tr>`).join('');
    }

    window.onload = init;
</script>
